on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: publish

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.30

      # The hub has no executable R chunks -- the worked example is shown, not
      # run -- so no R setup is needed here. If that ever changes, add
      # r-lib/actions/setup-r before this step.
      - name: Render site
        run: quarto render

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already; without this the job
          # 404s on a repository that has never had Pages enabled.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
